[package]
name = "cbor2-cli"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A practical cbor CLI for inspecting, decoding and encoding CBOR: diagnostic notation, JSON, hex/base64 and CBOR sequences."
readme = "README.md"
keywords = ["cbor", "json", "diagnostic", "cli", "hex"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
path = "./src/main.rs"
name = "cbor"
doc = false
test = false
bench = false

[dependencies]
num-bigint = "0.4"
# The CLI exposes the runtime’s CDN revision 29 parser and renderer.
cbor2 = { path = "..", version = "1.2.0" }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
serde = "1"
